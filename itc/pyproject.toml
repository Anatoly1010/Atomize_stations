[build-system]
requires = ["hatchling>=1.9.0", "hatch-vcs", "toml"]
build-backend = "hatchling.build"

[project]
name = "atomize-itc"
version = "0.5.0"
authors = [
    {name = "Atomize Developers"}
]
description = "Atomize station for the ITC EPR endstation: control center, EPR automation and Insys FPGA support"
readme = "readme.md"
requires-python = ">=3.10"
keywords = ["automation", "measurement", "instrument control", "EPR", "spectrometer"]
license = "MIT"

classifiers = [
    "Programming Language :: Python :: 3",
    "Intended Audience :: Science/Research",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX",
    "Topic :: Scientific/Engineering",
]

dependencies = ["atomize-py>=0.5", "pyyaml>=5.4"]
license-files = ["license.md"]

[project.scripts]
atomize-itc = "atomize.main.main:main"
epr-auto = "atomize.epr_auto.cli:main"

[project.urls]
Homepage = "https://github.com/Anatoly1010/Atomize_stations"
Core = "https://github.com/Anatoly1010/Atomize"

[project.optional-dependencies]
test = ["pytest>=7"]

[tool.hatch.build.targets.wheel]
packages = ["atomize"]
